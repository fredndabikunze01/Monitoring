
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitor your existing VM Node Exporter
  - job_name: 'vm-apps'
    static_configs:
      - targets:
          - '172.31.61.150:9100'

  # Monitor Node Exporter running in Docker
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
